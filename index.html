<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fold&amp;Roll — Your pocket DM screen</title>
<style>
  :root { --purple: #5b21b6; --purple-dark: #3b1478; --gold: #c9a227; --ink: #1d1a24; --muted: #5c5666; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--ink); background: #faf9fc; line-height: 1.6; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 4rem 1.25rem; text-align: center; }
  .die { font-size: 3.5rem; color: var(--purple); line-height: 1; }
  h1 { color: var(--purple-dark); font-size: 2.6rem; margin: .5rem 0 .25rem; }
  .tagline { font-size: 1.15rem; color: var(--ink); margin: 0 0 .5rem; }
  .desc { color: var(--muted); margin: 0 auto 2rem; max-width: 480px; }
  .links { border-top: 3px solid var(--gold); padding-top: 1.5rem; }
  .links a { display: inline-block; margin: 0 .75rem; color: var(--purple); font-weight: 600; text-decoration: none; border: 2px solid var(--purple); border-radius: 8px; padding: .55rem 1.2rem; }
  .links a:hover { background: var(--purple); color: #fff; }
  footer { margin-top: 3rem; color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<div class="wrap">
  <div class="die">◆</div>
  <h1>Fold&amp;Roll</h1>
  <p class="tagline">Your pocket DM screen.</p>
  <p class="desc">The tabletop RPG companion for iPhone and iPad — battle maps, instant dice, and a full DM screen, connected over your local network. No account. No subscription.</p>
  <div class="links">
    <a href="support.html">Support</a>
    <a href="privacy.html">Privacy Policy</a>
  </div>
  <footer>Questions? <a href="mailto:kvnkillian@gmail.com" style="color:var(--purple)">kvnkillian@gmail.com</a></footer>
</div>
</body>
</html>
